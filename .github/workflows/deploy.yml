name: deploy backend

on:
  push:
    branches: 
         - main

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: login to Docker hub
          uses: docker/login-action@v3
          with:
             username: ${{ secrets.DOCKER_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}
        
        - name: Build Docker Image
          run: |
            docker build -t merge-backend .
        
        - name: Push Docker Image
          run: |
            docker push merge-backend:latest

        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
               docker pull merge-backend:latest

               docker stop merge-backend || true
               docker rm merge-backend || true

               docker run -d \
                   --name merge-backend \
                   -p 5000:5000 \
                   --env-file .env \
                   yourdockerhub/merge-backend:latest